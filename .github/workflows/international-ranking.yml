name: Verify FIA international ranking importer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run diagnostic without overwriting ranking data
        run: python scripts/update_international_ranking.py
      - name: Assert published ranking remains intact
        run: |
          python - <<'PY'
          import json
          with open('public/international-ranking.json', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data.get('records'), list) and data['records'], 'No ranking records'
          print(f"Preserved {len(data['records'])} existing ranking records; FIA importer remains unverified.")
          PY
