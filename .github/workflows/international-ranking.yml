name: Refresh FIA international ranking

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_international_ranking.py"
      - ".github/workflows/international-ranking.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kartgrid-international-ranking
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Refresh FIA ranking
        run: python scripts/update_international_ranking.py
      - name: Commit refreshed ranking
        run: |
          git config user.name "KartGrid Ranking Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/international-ranking.json
          if git diff --cached --quiet; then
            echo "No ranking changes"
          else
            git commit -m "Refresh FIA international ranking"
            git pull --rebase origin main
            git push
          fi
