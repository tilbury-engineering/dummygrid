name: Harvest published What3Words

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/harvest_what3words.py"
      - ".github/workflows/what3words.yml"
  schedule:
    - cron: "43 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dummygrid-what3words-harvest
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Harvest published venue What3Words
        run: python scripts/harvest_what3words.py
      - name: Commit published What3Words
        run: |
          git config user.name "DummyGrid What3Words Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/tracks.json src/data/tracks.json
          if git diff --cached --quiet; then
            echo "No new published What3Words addresses"
          else
            git commit -m "Add published track What3Words addresses"
            git pull --rebase origin main
            git push
          fi
