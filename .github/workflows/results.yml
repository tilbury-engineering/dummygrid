name: Refresh karting results

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_results.py"
      - ".github/workflows/results.yml"
  schedule:
    - cron: "37 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dummygrid-results-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh official karting results
        run: python scripts/update_results.py

      - name: Commit refreshed results
        run: |
          git config user.name "DummyGrid Results Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/results.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Refresh global karting results"
            git pull --rebase origin main
            git push
          fi
