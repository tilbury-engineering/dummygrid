name: Refresh karting results

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_results.py"
      - ".github/workflows/results.yml"
  schedule:
    - cron: "37 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dummygrid-results-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh official karting results
        run: python scripts/update_results.py

      - name: Reject invalid generated JSON before publication
        run: node scripts/validate_public_release.mjs

      - name: Commit refreshed results
        run: |
          git config user.name "DummyGrid Results Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/results.json public/results-normalized.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            # Another scheduled bot may have advanced main during this run.
            # Retry against fresh main and regenerate, rather than rebasing
            # generated JSON onto an incompatible historical snapshot.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              python scripts/update_results.py
              node scripts/validate_public_release.mjs
              git add public/results.json public/results-normalized.json
              if git diff --cached --quiet; then
                echo "Results already up to date"
                exit 0
              fi
              git commit -m "Refresh global karting results"
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent update detected; retry $attempt"
              sleep 2
            done
            echo "Failed to publish results after three retries"
            exit 1
          fi
