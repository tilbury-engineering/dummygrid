name: Enrich track locations

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/enrich_tracks.py"
      - ".github/workflows/tracks.yml"
  schedule:
    - cron: "28 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dummygrid-track-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WHAT3WORDS_API_KEY: ${{ secrets.WHAT3WORDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Verify track addresses and What3Words
        run: python scripts/enrich_tracks.py
      - name: Commit enriched track data
        run: |
          git config user.name "DummyGrid Tracks Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/tracks.json
          if git diff --cached --quiet; then
            echo "No location changes"
          else
            git commit -m "Enrich track addresses and What3Words"
            git pull --rebase origin main
            git push
          fi
