name: Refresh global kart tracks

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_global_tracks.py"
      - ".github/workflows/global-tracks.yml"
  schedule:
    - cron: "17 2 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dummygrid-global-track-refresh-v2
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests reverse_geocoder pycountry scipy
      - name: Import worldwide karting venues
        run: python scripts/update_global_tracks.py
      - name: Commit global track directory
        run: |
          git config user.name "DummyGrid Global Tracks Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/tracks.json
          if git diff --cached --quiet; then
            echo "No global track changes"
          else
            git commit -m "Expand global kart track directory"
            git pull --rebase origin main
            git push
          fi
